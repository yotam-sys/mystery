<title>Mystery Player Showdown</title>

<style>
/* Layout: arena at night. A jumbotron-style scoreboard header, then one panel per game phase (home, lobby, clue race, reveal, final), standings strip below. Single dark theme by choice. */
:root {
  color-scheme: dark;
  --bg: #0A0F1E;
  --panel: #131A31;
  --line: #253057;
  --ink: #F2F4FA;
  --muted: #8E98BA;
  --ball: #FF7A1A;
  --led: #FFC23D;
  --good: #3BE38F;

  --f-display: "Teko", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-led: "Share Tech Mono", ui-monospace, "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {

    var(--bg);
  background-attachment: fixed;
  color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

/* jumbotron */
.jumbo { border: 2px solid var(--line); border-radius: 14px; background: linear-gradient(#0E1428, #0A0F1E); padding: 12px 16px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; position: relative; overflow: hidden; }
.jumbo::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,194,61,.09) 1px, transparent 1.4px); background-size: 6px 6px; pointer-events: none; }
.brand { position: relative; line-height: .82; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(34px, 10vw, 46px); letter-spacing: .02em; text-transform: uppercase; }
.brand h1 span { color: var(--ball); }
.brand small { display: block; margin-top: 6px; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
.clock { position: relative; text-align: right; font-family: var(--f-led); color: var(--led); text-shadow: 0 0 10px rgba(255,194,61,.55); }
.clock .big { font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.clock .lbl { font-family: var(--f-body); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); text-shadow: none; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.panel h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 30px; line-height: 1; text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
.panel p { margin: 0; color: var(--muted); max-width: 62ch; }
.panel p b { color: var(--ink); }
.kicker { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status.on i { background: var(--good); box-shadow: 0 0 8px var(--good); }
.status.off i { background: var(--bad); }

label.fld { display: flex; flex-direction: column; gap: 6px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
input[type=text] { width: 100%; min-width: 0; font-family: var(--f-body); font-weight: 600; font-size: 18px; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 11px 13px; }
input[type=text]:focus { outline: none; border-color: var(--ball); box-shadow: 0 0 0 3px rgba(255,122,26,.2); }
input.code { font-family: var(--f-led); font-size: 22px; letter-spacing: .3em; text-transform: uppercase; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.btn { border: 0; border-radius: 10px; padding: 13px 16px; cursor: pointer; font-family: var(--f-display); font-weight: 600; font-size: 22px; line-height: 1; letter-spacing: .04em; text-transform: uppercase; color: #1A0B00; background: var(--ball); box-shadow: 0 4px 0 #9C430A; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #9C430A; }

.or { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.err { color: var(--bad); font-size: 14px; min-height: 20px; }

.codebox .c { font-family: var(--f-led); font-size: 46px; letter-spacing: .25em; color: var(--led); text-shadow: 0 0 14px rgba(255,194,61,.5); line-height: 1.1; padding-left: .25em; }

.pl { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; background: var(--bg); border: 1px solid var(--line); }

.pl .nm em { font-style: normal; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-left: 6px; }
.pl .st { font-family: var(--f-led); font-size: 15px; font-variant-numeric: tabular-nums; color: var(--muted); }
.pl .st.ok { color: var(--good); } .pl .st.no { color: var(--bad); }
.pl.me { border-color: var(--ball); }

/* clue race */
.worth { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.worth b { font-family: var(--f-led); color: var(--led); font-size: 22px; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(255,194,61,.45); }
.shot { height: 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.shot i { display: block; height: 100%; width: 100%; background: var(--ball); transform-origin: left; transform: scaleX(0); }
.clues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.clues li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.clues li .n { font-family: var(--f-led); color: var(--ball); font-size: 15px; padding-top: 1px; }
.clues li.new { border-color: var(--ball); animation: drop .4s ease; }
.clues li.locked { color: var(--muted); opacity: .55; border-style: dashed; }
@keyframes drop { from { transform: translateY(-6px); } to { transform: none; } }
form.guess { display: flex; gap: 8px; }
form.guess input { flex: 1; }
form.guess .btn { flex: 0 0 auto; }
.verdict { text-align: center; padding: 10px; border-radius: 10px; font-family: var(--f-display); font-size: 28px; line-height: 1; text-transform: uppercase; }
.verdict.ok { color: var(--good); border: 2px solid var(--good); }
.verdict.no { color: var(--bad); border: 2px solid var(--bad); }
.verdict small { display: block; font-family: var(--f-body); font-size: 14px; text-transform: none; color: var(--muted); margin-top: 6px; }
.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }

.answer { text-align: center; display: flex; flex-direction: column; gap: 2px; }
.answer .who { font-family: var(--f-display); font-weight: 700; font-size: clamp(40px, 12vw, 56px); line-height: .95; text-transform: uppercase; color: var(--ball); animation: slam .45s ease; }
@keyframes slam { 0% { transform: scale(1.5); opacity: 0; } 60% { transform: scale(.96); opacity: 1; } 100% { transform: none; } }

.board { display: flex; flex-direction: column; gap: 6px; }
.board .pl .st { color: var(--led); font-size: 18px; }
.podium .pl:first-child { border-color: var(--led); box-shadow: 0 0 16px rgba(255,194,61,.25); }
.rules { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; color: var(--muted); font-size: 15px; }
.rules b { color: var(--ink); }
.note { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
@media (prefers-reduced-motion: reduce) { .clues li.new, .answer .who, .shake { animation: none; } }
</style>
</head>

const gameState = () => { const h = host(); return h ? h.presence.g : null; };
const resOf = (p, g) => { const r = p.presence.res; return (g && r && r.game === g.id) ? toArr(r.r) : []; };
const scoreOf = (p, g) => resOf(p, g).reduce((a, x) => a + (x && x.ok ? pts(x.c) : 0), 0);

// ---------- host loop ----------
function setG(patch) { setMe({ g: Object.assign({}, me.g, patch) }); }
function hostStart() {
  const order = PLAYERS.map((_, i) => i).sort(() => Math.random() - .5).slice(0, ROUNDS);
  hostClueAt = Date.now();
  setMe({ g: { id: Math.random().toString(36).slice(2, 8), phase: "round", round: 0, clue: 0, order } });
}
setInterval(() => {
  if (!me.host || !me.g) return;
  const g = me.g, now = Date.now(), players = inGame();
  if (g.phase === "round") {
    const allDone = players.length > 0 && players.every(p => resOf(p, g)[g.round] != null);
    if (allDone) { hostPhaseAt = now; setG({ phase: "reveal" }); }
    else if (g.clue < 5 && now - hostClueAt >= CLUE_MS) { hostClueAt = now; setG({ clue: g.clue + 1 }); }
    else if (g.clue === 5 && now - hostClueAt >= GRACE_MS) { hostPhaseAt = now; setG({ phase: "reveal" }); }
  } else if (g.phase === "reveal" && now - hostPhaseAt >= REVEAL_MS) {
    if (g.round < ROUNDS - 1) { hostClueAt = now; setG({ phase: "round", round: g.round + 1, clue: 0 }); }
    else setG({ phase: "final" });
  }
}, 250);
setInterval(schedule, 200);

// ---------- actions ----------
function saveName() {
  const v = (document.getElementById("nm").value || "").trim().slice(0, 16);
  if (!v) { homeErr = "Type a name first."; render(true); return null; }
  store.set("mp-name", v); me.name = v; return v;
}
function onlineReady() {
  if (!db) { homeErr = configured ? "Couldn't reach Firebase. Check your config." : "Online play isn't set up yet. Paste your Firebase config into the file (see the README)."; render(true); return false; }
  return true;
}
function goSolo() { if (!saveName()) return; mode = "solo"; me.code = "SOLO"; me.host = true; me.g = null; me.res = null; hostStart(); render(true); }
async function goCreate() {
  if (!saveName() || !onlineReady()) return;
  homeErr = "Creating game…"; render(true);
  try {
    let code = "";
    for (let tries = 0; tries < 5; tries++) {
      code = Array.from({ length: 4 }, () => "ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.floor(Math.random() * 24)]).join("");
      if (!(await get(ref(db, gamePath(code) + "/host"))).exists()) break;
    }
    await set(ref(db, gamePath(code)), { host: myId, createdAt: serverTimestamp(), players: { [myId]: { name: me.name, color: me.color } } });
    onDisconnect(ref(db, gamePath(code))).remove();
    me.code = code; me.host = true; me.g = null; me.res = null; mode = "online"; homeErr = "";
    listen(code); render(true);
  } catch (e) { console.error(e); homeErr = "Couldn't create the game. Check your Firebase rules and config."; render(true); }
}
async function goJoin() {
  if (!saveName() || !onlineReady()) return;
  const code = (document.getElementById("cd").value || "").toUpperCase().replace(/[^A-Z]/g, "");
  if (code.length !== 4) { homeErr = "Game codes have 4 letters."; render(true); return; }
  try {
    if (!(await get(ref(db, gamePath(code) + "/host"))).exists()) { homeErr = "No game with code " + code + ". Check it with your friend."; render(true); return; }
    const pRef = ref(db, gamePath(code) + "/players/" + myId);
    await set(pRef, { name: me.name, color: me.color });
    onDisconnect(pRef).remove();
    me.code = code; me.host = false; me.g = null; me.res = null; mode = "online"; homeErr = "";
    listen(code); render(true);
  } catch (e) { console.error(e); homeErr = "Couldn't join. Check your connection."; render(true); }
}
function leave() {
  if (mode === "online" && db && me.code) {
    const target = me.host ? ref(db, gamePath(me.code)) : ref(db, gamePath(me.code) + "/players/" + myId);
    onDisconnect(target).cancel().catch(() => {});
    remove(target).catch(() => {});
    stopListen();
  }
  me = { name: me.name, color: me.color };
  mode = "home"; homeErr = ""; render(true);
}
function guess(e) {
  e.preventDefault();
  const g = gameState(); if (!g || g.phase !== "round") return;
  const mine = allPeers().find(p => p.isMe);
  if (resOf(mine, g)[g.round] != null) return;
  const inp = document.getElementById("gs"), hit = lookup(inp.value);
  const err = document.getElementById("gerr");
  if (!hit) { err.textContent = "Not a player we know. Check the spelling or pick from the list."; inp.parentNode.classList.remove("shake"); void inp.offsetWidth; inp.parentNode.classList.add("shake"); return; }
  const ok = hit.idx === g.order[g.round];
  const prev = (me.res && me.res.game === g.id) ? me.res.r : {};
  const r = Object.assign({}, prev, { ["r" + g.round]: { ok, c: g.clue, n: hit.name.slice(0, 30) } });
  setMe({ res: { game: g.id, r } });
  render(true);
}

// ---------- rendering ----------
let raf = 0;
function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(false); }); }
let lastKey = "";
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function rosterHTML(g, opts) {
  const list = inGame().slice();
  if (opts && opts.sort) list.sort((a, b) => scoreOf(b, g) - scoreOf(a, g));
  return list.map(p => {
    const pr = p.presence, x = g ? resOf(p, g)[g.round] : null;
    let st = "", cls = "";
    if (opts && opts.score) st = scoreOf(p, g);
    else if (opts && opts.round) { if (x) { st = x.ok ? "✓ clue " + (x.c + 1) : "✖ locked"; cls = x.ok ? "ok" : "no"; } else st = "thinking…"; }
    else st = pr.host ? "host" : "ready";
    return '<div class="pl' + (p.isMe ? " me" : "") + '"><span class="dot" style="background:' + esc(/^#[0-9A-Fa-f]{6}$/.test(pr.color) ? pr.color : "#888") + '"></span><span class="nm">' + esc(String(pr.name).slice(0, 16)) + (p.isMe ? "<em>you</em>" : "") + '</span><span class="st ' + cls + '">' + esc(st) + '</span></div>';
  }).join("");
}

function render(force) {
  const g = mode === "home" ? null : gameState();
  const mine = allPeers().find(p => p.isMe);
  const myRes = g ? resOf(mine, g)[g.round] : null;
  let view = "home";
  if (mode !== "home") {
    if (mode === "online" && !me.host && remote.loaded && !remote.exists) view = "ended";
    else if (!host()) view = me.host ? "lobby" : "nohost";
    else if (!g) view = "lobby";
    else view = g.phase;
  }
  const key = view + "|" + (g ? g.id + g.round : "") + "|" + (myRes ? "done" : "") + "|" + (view === "home" ? net : "") + "|" + mode;
  // jumbotron
  const jc = document.getElementById("jClock"), jl = document.getElementById("jLbl");
  if (view === "round") { jc.textContent = "Q" + (g.round + 1) + " · " + pts(g.clue); jl.textContent = "Points on the board"; }
  else if (view === "reveal") { jc.textContent = "Q" + (g.round + 1) + " END"; jl.textContent = "Round over"; }
  else if (view === "final") { jc.textContent = "FINAL"; jl.textContent = "Game over"; }
  else if (view === "lobby" || view === "nohost") { jc.textContent = me.code === "SOLO" ? "SOLO" : (me.code || "--"); jl.textContent = "Game code"; }
  else { jc.textContent = "--"; jl.textContent = "Pregame"; }

  if (force || key !== lastKey) { lastKey = key; build(view, g, myRes); }
  update(view, g, myRes);
}

function build(view, g, myRes) {
  if (view === "home") {
    const netTxt = net === "on" ? "Online ready" : net === "connecting" ? "Connecting…" : "Online unavailable";
    app.innerHTML = '<div class="panel">' +
      '<div class="status ' + (net === "on" ? "on" : net === "off" ? "off" : "") + '"><i></i>' + netTxt + '</div>' +
      '<h2>Guess the NBA player before your friends do</h2>' +
      '<ol class="rules"><li>A clue about a secret NBA player appears <b>every 6 seconds</b>, starting with the hardest.</li><li>Guess right on clue 1 for <b>600</b> points, clue 6 for <b>100</b>.</li><li>You get <b>one guess per player</b>. A wrong guess locks you out of that round.</li><li>5 mystery players per game. Highest total wins.</li></ol>' +
      '<label class="fld">Your name<input type="text" id="nm" maxlength="16" autocomplete="off" value="' + esc(me.name) + '" placeholder="e.g. Yotam"></label>' +
      '<div class="row"><button class="btn" id="bCreate" type="button">Create game</button></div>' +
      '<div class="or">or join a friend</div>' +
      '<div class="row"><input type="text" class="code" id="cd" maxlength="4" autocomplete="off" placeholder="CODE" aria-label="Game code"><button class="btn ghost" id="bJoin" type="button">Join</button></div>' +
      '<div class="or">or</div>' +
      '<button class="btn ghost" id="bSolo" type="button">Solo practice</button>' +
      '<div class="err" id="herr">' + esc(homeErr) + '</div>' +
      '<div class="note">To play online, send the link to this page to your friends. One person creates a game and the others type its code.</div>' +
      '</div>';
    document.getElementById("bCreate").onclick = goCreate;
    document.getElementById("bJoin").onclick = goJoin;
    document.getElementById("bSolo").onclick = goSolo;
    document.getElementById("cd").addEventListener("keydown", e => { if (e.key === "Enter") goJoin(); });
    return;
  }
  if (view === "ended") {
    app.innerHTML = '<div class="panel"><div class="kicker">Game over</div><h2>The host ended the game</h2><p>The host left or closed the page. Start a new game or join another code.</p><button class="btn" id="bLeave" type="button">Back to home</button></div>';
    document.getElementById("bLeave").onclick = leave; return;
  }
  if (view === "nohost") {
    app.innerHTML = '<div class="panel"><div class="kicker">Joining game</div><h2>Waiting for game ' + esc(me.code) + '</h2><p>No host with this code is online right now. Check the code with your friend, or wait for them to create the game.</p><div class="roster" id="roster"></div><button class="btn ghost" id="bLeave" type="button">Back</button></div>';
    document.getElementById("bLeave").onclick = leave; return;
  }
  if (view === "lobby") {
    app.innerHTML = '<div class="panel"><div class="kicker">Lobby</div>' +
      (me.code !== "SOLO" ? '<div class="codebox"><div class="kicker">Game code</div><div class="c">' + esc(me.code) + '</div></div>' : '') +
      '<h2 id="lobbyH"></h2><div class="roster" id="roster"></div>' +
      (me.host ? '<button class="btn" id="bStart" type="button">Tip off</button>' : '<p>The host starts the game when everyone is in.</p>') +
      '<button class="btn ghost" id="bLeave" type="button">Leave</button></div>';
    if (me.host) document.getElementById("bStart").onclick = hostStart;
    document.getElementById("bLeave").onclick = leave; return;
  }
  if (view === "round") {
    app.innerHTML = '<div class="panel">' +
      '<div class="worth"><div class="kicker">Mystery player ' + (g.round + 1) + ' of ' + ROUNDS + '</div><div>Worth <b id="worth"></b></div></div>' +
      '<div class="shot"><i id="shot"></i></div>' +
      '<ol class="clues" id="clues"></ol>' +
      (myRes ? '<div class="verdict ' + (myRes.ok ? "ok" : "no") + '">' + (myRes.ok ? "Bucket! +" + pts(myRes.c) : "Airball") + '<small>' + (myRes.ok ? "Waiting for the others…" : esc(myRes.n) + " isn't it. You're locked out this round.") + '</small></div>'
        : '<form class="guess" id="gform"><input type="text" id="gs" list="names" autocomplete="off" placeholder="Type a player" aria-label="Your guess"><button class="btn" type="submit">Shoot</button></form><div class="err" id="gerr"></div>') +
      '<div class="kicker">On the court</div><div class="roster" id="roster"></div></div>';
    if (!myRes) { document.getElementById("gform").onsubmit = guess; setTimeout(() => { const i = document.getElementById("gs"); if (i) i.focus({ preventScroll: true }); }, 30); }
    lastClueSeen = -1; return;
  }
  if (view === "reveal") {
    const p = PLAYERS[g.order[g.round]];
    app.innerHTML = '<div class="panel"><div class="answer"><div class="kicker">Mystery player ' + (g.round + 1) + ' was</div><div class="who">' + esc(p.name) + '</div></div>' +
      '<ol class="clues">' + p.clues.map((c, i) => '<li' + (i > g.clue ? ' class="locked"' : '') + '><span class="n">' + (i + 1) + '</span><span>' + esc(c) + '</span></li>').join("") + '</ol>' +
      '<div class="kicker">This round</div><div class="roster" id="roster"></div>' +
      '<div class="kicker">Standings</div><div class="board" id="board"></div>' +
      '<p id="nextIn">' + (g.round < ROUNDS - 1 ? "Next player coming up…" : "Final scores coming up…") + '</p></div>';
    return;
  }
  if (view === "final") {
    app.innerHTML = '<div class="panel"><div class="kicker">Final buzzer</div><h2 id="champ"></h2><div class="board podium" id="board"></div>' +
      '<div class="kicker">The five mystery players</div><p>' + g.order.map(i => esc(PLAYERS[i].name)).join(" · ") + '</p>' +
      (me.host ? '<button class="btn" id="bAgain" type="button">Run it back</button>' : '<p>The host can start a rematch.</p>') +
      '<button class="btn ghost" id="bLeave" type="button">Leave game</button></div>';
    if (me.host) document.getElementById("bAgain").onclick = hostStart;
    document.getElementById("bLeave").onclick = leave; return;
  }
}

function update(view, g, myRes) {
  const ro = document.getElementById("roster");
  if (view === "lobby" || view === "nohost") {
    if (ro) ro.innerHTML = rosterHTML(null, {});
    const h = document.getElementById("lobbyH"); if (h) { const n = inGame().length; h.textContent = me.code === "SOLO" ? "Solo practice" : n + (n === 1 ? " player in the gym" : " players in the gym"); }
  }
  if (view === "round") {
    if (ro) ro.innerHTML = rosterHTML(g, { round: true });
    const w = document.getElementById("worth"); if (w) w.textContent = myRes ? (myRes.ok ? pts(myRes.c) : 0) : pts(g.clue);
    const cl = document.getElementById("clues"), p = PLAYERS[g.order[g.round]];
    if (cl && lastClueSeen !== g.clue) {
      cl.innerHTML = p.clues.slice(0, g.clue + 1).map((c, i) => '<li' + (i === g.clue && i > 0 ? ' class="new"' : '') + '><span class="n">' + (i + 1) + '</span><span>' + esc(c) + '</span></li>').join("") +
        (g.clue < 5 ? '<li class="locked"><span class="n">' + (g.clue + 2) + '</span><span>Next clue incoming…</span></li>' : '');
      lastClueSeen = g.clue; clueSeenAt = performance.now();
    }
    const sh = document.getElementById("shot");
    if (sh) { const f = Math.min(1, (performance.now() - clueSeenAt) / (g.clue < 5 ? CLUE_MS : GRACE_MS)); sh.style.transform = "scaleX(" + f + ")"; }
  }
  if (view === "reveal") {
    if (ro) ro.innerHTML = rosterHTML(g, { round: true });
    const b = document.getElementById("board"); if (b) b.innerHTML = rosterHTML(g, { score: true, sort: true });
  }
  if (view === "final") {
    const b = document.getElementById("board"); if (b) b.innerHTML = rosterHTML(g, { score: true, sort: true });
    const c = document.getElementById("champ"), list = inGame().slice().sort((a, b2) => scoreOf(b2, g) - scoreOf(a, g));
    if (c && list[0]) c.textContent = list.length === 1 ? "You scored " + scoreOf(list[0], g) + " of 3000" : String(list[0].presence.name).slice(0, 16) + " wins it";
  }
}
render(true);
</script>
</body>
</html>
